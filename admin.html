<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peshras Admin — Панель Управления</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<!-- ═══════ ВХОД ═══════ -->
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-yellow-400/10 text-yellow-400 mb-2 border border-yellow-400/20">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Вход Администратора</h1>
      <p class="text-xs text-gray-400">Панель главного управления Peshras</p>
    </div>
    <form id="admin-login-form" class="space-y-4">
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Email Админа</label>
        <input type="email" id="admin-email" required placeholder="admin@peshras.tj"
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400">
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-gray-300">Пароль</label>
        <input type="password" id="admin-password" required placeholder="••••••••"
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400">
      </div>
      <div id="admin-error" class="text-xs text-red-400 hidden"></div>
      <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
        <span>Войти</span><i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>
  </div>
</div>

<!-- ═══════ АДМИНКА ═══════ -->
<div id="admin-app" class="hidden min-h-screen flex flex-col">
  <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span class="text-lg font-black text-emerald-400">PESHRAS <span class="text-yellow-400 text-xs px-2 py-0.5 bg-yellow-400/10 rounded border border-yellow-400/20">SUPER ADMIN</span></span>
      <button onclick="adminLogout()" class="text-gray-400 hover:text-red-400 p-2"><i data-lucide="log-out" class="w-5 h-5"></i></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 space-y-8">
    <div class="flex border-b border-gray-800 gap-6 text-sm font-bold overflow-x-auto pb-2">
      <button onclick="switchAdminTab('restaurants')" id="atab-restaurants" class="pb-3 border-b-2 border-yellow-400 text-yellow-400 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="store" class="w-4 h-4"></i><span>Рестораны</span>
      </button>
      <button onclick="switchAdminTab('all-orders')" id="atab-orders" class="pb-3 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap">
        <i data-lucide="shopping-bag" class="w-4 h-4"></i><span>Все заказы</span>
      </button>
    </div>

    <!-- РЕСТОРАНЫ -->
    <section id="sec-restaurants" class="space-y-6">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
          <span>Добавить новый ресторан</span>
        </h3>
        <form id="add-restaurant-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Название ресторана *</label>
            <input type="text" id="res-name" required placeholder="Райхон"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Адрес *</label>
            <input type="text" id="res-address" required placeholder="ул. И. Сомони 12"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Телефон</label>
            <input type="text" id="res-phone" placeholder="+992921234567"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Логотип (URL)</label>
            <input type="url" id="res-logo" placeholder="https://..."
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Кухня / тип</label>
            <input type="text" id="res-cuisine" placeholder="Национальная"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Комиссия (%) — опционально</label>
            <input type="number" id="res-commission" placeholder="10"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Email партнёра (для входа) *</label>
            <input type="email" id="res-email" required placeholder="rayhon@peshras.tj"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 font-semibold">Пароль партнёра (мин. 6 символов) *</label>
            <input type="password" id="res-password" required minlength="6" placeholder="••••••••"
              class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
          </div>
          <div class="sm:col-span-2 lg:col-span-3 pt-2">
            <button type="submit" id="create-rest-btn"
              class="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-6 py-2.5 rounded-xl transition text-xs flex items-center gap-2">
              <span>Зарегистрировать ресторан + создать аккаунт</span>
              <i data-lucide="check" class="w-4 h-4"></i>
            </button>
            <p id="create-rest-status" class="text-xs mt-2 hidden"></p>
          </div>
        </form>
      </div>

      <div class="space-y-3">
        <h4 class="font-bold text-white text-sm">Подключенные заведения:</h4>
        <div id="admin-restaurants-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="text-gray-500 text-xs py-4">Загрузка...</div>
        </div>
      </div>
    </section>

    <!-- ЗАКАЗЫ -->
    <section id="sec-orders" class="hidden space-y-4">
      <div id="admin-orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="text-gray-500 text-xs py-4">Загрузка заказов...</div>
      </div>
    </section>
  </main>
</div>

<!-- ═══════ FIREBASE ═══════ -->
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM",
  authDomain: "peshras-delivery.firebaseapp.com",
  projectId: "peshras-delivery",
  storageBucket: "peshras-delivery.firebasestorage.app",
  messagingSenderId: "790787117044",
  appId: "1:790787117044:web:217ef1bea4edbab24873a1"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' сомонӣ';

/* ───────── ВХОД ───────── */
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('admin-error');
  err.classList.add('hidden');
  try {
    await signInWithEmailAndPassword(auth,
      document.getElementById('admin-email').value,
      document.getElementById('admin-password').value);
  } catch (e2) {
    err.innerText = 'Неверный email или пароль';
    err.classList.remove('hidden');
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    loadAdminRestaurants();
    listenAllOrders();
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('admin-app').classList.add('hidden');
  }
  lucide.createIcons();
});
window.adminLogout = () => signOut(auth);

/* ───────── СОЗДАНИЕ РЕСТОРАНА + АККАУНТА ───────── */
document.getElementById('add-restaurant-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn    = document.getElementById('create-rest-btn');
  const status = document.getElementById('create-rest-status');
  const email  = document.getElementById('res-email').value.trim();
  const pass   = document.getElementById('res-password').value;

  btn.disabled = true;
  btn.innerHTML = 'Создаём...';
  status.classList.add('hidden');

  let secondaryApp = null;
  try {
    /* 1. Создаём Auth-пользователя во ВТОРОМ приложении (не выкидывая админа) */
    secondaryApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    const uid = cred.user.uid;

    /* 2. Создаём документ restaurants с owner_uid = uid */
    await addDoc(collection(db, 'restaurants'), {
      name: document.getElementById('res-name').value.trim(),
      address: document.getElementById('res-address').value.trim(),
      phone: document.getElementById('res-phone').value.trim(),
      logo_url: document.getElementById('res-logo').value.trim(),
      cuisine: document.getElementById('res-cuisine').value.trim(),
      commission: document.getElementById('res-commission').value
                    ? Number(document.getElementById('res-commission').value)
                    : null,
      owner_uid: uid,
      owner_email: email,
      created_at: serverTimestamp()
    });

    /* 3. Чистим */
    await signOut(secondaryAuth);
    await deleteApp(secondaryApp);

    status.className = 'text-xs mt-2 text-emerald-400';
    status.innerText = `✅ Ресторан создан. UID владельца: ${uid}`;
    status.classList.remove('hidden');
    e.target.reset();
  } catch (err) {
    console.error(err);
    status.className = 'text-xs mt-2 text-red-400';
    let msg = 'Ошибка создания.';
    if (err.code === 'auth/email-already-in-use') msg = 'Этот email уже используется.';
    else if (err.code === 'auth/weak-password')   msg = 'Пароль слишком слабый (мин. 6 символов).';
    else if (err.code === 'auth/invalid-email')   msg = 'Неверный email.';
    status.innerText = '❌ ' + msg;
    status.classList.remove('hidden');
    if (secondaryApp) try { await deleteApp(secondaryApp); } catch {}
  } finally {
    btn.disabled = false;
    btn.innerHTML = `Зарегистрировать ресторан + создать аккаунт`;
    lucide.createIcons();
  }
});

/* ───────── СПИСОК РЕСТОРАНОВ ───────── */
function loadAdminRestaurants() {
  const container = document.getElementById('admin-restaurants-list');
  onSnapshot(collection(db, 'restaurants'), snap => {
    if (snap.empty) {
      container.innerHTML = `<div class="text-gray-500 text-xs py-4 col-span-full">Ресторанов пока нет</div>`;
      return;
    }
    container.innerHTML = snap.docs.map(d => {
      const r = d.data();
      return `
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-2">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-gray-800 overflow-hidden flex-shrink-0">
              ${r.logo_url ? `<img src="${esc(r.logo_url)}" class="w-full h-full object-cover" onerror="this.style.display='none'">` : ''}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <h4 class="font-extrabold text-white text-sm truncate">${esc(r.name)}</h4>
                <span class="text-xs bg-emerald-500/10 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/20 whitespace-nowrap">
                  ${r.commission ?? '—'}%
                </span>
              </div>
              <p class="text-xs text-gray-400 truncate">📍 ${esc(r.address || '—')}</p>
              <p class="text-xs text-gray-400 truncate">📞 ${esc(r.phone || '—')}</p>
            </div>
            <button onclick="delRestaurant('${d.id}')" class="text-red-400 hover:text-red-300 p-1 flex-shrink-0">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="text-[10px] text-gray-600 font-mono break-all">owner_uid: ${esc(r.owner_uid || '—')}</div>
          <div class="text-[10px] text-gray-600 font-mono break-all">restaurants.id: ${d.id}</div>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  });
}

window.delRestaurant = async function (id) {
  if (!confirm('Удалить ресторан? Блюда и заказы останутся в базе, но перестанут быть привязаны.')) return;
  try { await deleteDoc(doc(db, 'restaurants', id)); }
  catch (e) { console.error(e); alert('Ошибка удаления'); }
};

/* ───────── ВСЕ ЗАКАЗЫ ───────── */
function listenAllOrders() {
  onSnapshot(collection(db, 'orders'), snap => {
    const container = document.getElementById('admin-orders-list');
    if (snap.empty) {
      container.innerHTML = `<div class="text-gray-500 text-xs py-4 col-span-full">Заказов пока нет</div>`;
      return;
    }
    const orders = [];
    snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
    orders.sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));

    container.innerHTML = orders.map(o => `
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-2 text-xs">
        <div class="flex justify-between items-center">
          <span class="font-mono text-gray-400">#${o.id.substring(0,6)}</span>
          <span class="text-amber-400 font-bold">${o.status}</span>
        </div>
        <p class="text-white font-bold">${esc(o.client_name)} · ${esc(o.client_phone)}</p>
        <p class="text-gray-400">${esc(o.delivery_address)}</p>
        <p class="text-gray-500">Ресторан: ${esc(o.restaurant_name || o.restaurant_id || '—')}</p>
        <p class="text-yellow-400 font-black">${fmt(o.total_price)}</p>
      </div>
    `).join('');
  });
}

window.switchAdminTab = function (tab) {
  document.getElementById('sec-restaurants').classList.toggle('hidden', tab !== 'restaurants');
  document.getElementById('sec-orders').classList.toggle('hidden', tab !== 'all-orders');
  const a = 'pb-3 border-b-2 border-yellow-400 text-yellow-400 flex items-center gap-2 whitespace-nowrap';
  const i = 'pb-3 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap';
  document.getElementById('atab-restaurants').className = tab === 'restaurants' ? a : i;
  document.getElementById('atab-orders').className = tab === 'all-orders' ? a : i;
};

lucide.createIcons();
</script>
</body>
</html>
