<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peshras Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 max-w-md w-full space-y-4">
    <h1 class="text-2xl font-black text-yellow-400">PESHRAS ADMIN</h1>
    <form id="login-form">
      <input type="email" id="email" required placeholder="Email" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 mb-2 text-sm">
      <input type="password" id="password" required placeholder="Пароль" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 mb-2 text-sm">
      <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl">Войти</button>
    </form>
  </div>
</div>

<div id="app-screen" class="hidden min-h-screen flex flex-col">
  <header class="bg-gray-900 border-b border-gray-800 p-3 flex justify-between">
    <span class="font-black text-emerald-400">ADMIN</span>
    <button onclick="logout()">Выйти</button>
  </header>
  <main class="max-w-7xl mx-auto p-4 w-full space-y-4">
    <div class="flex gap-4 border-b border-gray-800 pb-2 text-sm font-bold overflow-x-auto">
      <button onclick="switchTab('dash')" id="tb-dash" class="text-yellow-400">Дашборд</button>
      <button onclick="switchTab('rest')" id="tb-rest" class="text-gray-400">Рестораны</button>
      <button onclick="switchTab('prod')" id="tb-prod" class="text-gray-400">Товары</button>
      <button onclick="switchTab('ord')" id="tb-ord" class="text-gray-400">Заказы</button>
      <button onclick="switchTab('set')" id="tb-set" class="text-gray-400">Настройки</button>
    </div>

    <section id="sec-dash" class="space-y-4">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl"><p class="text-[10px] text-gray-500">Заказов сегодня</p><p id="d-ord" class="text-2xl font-black text-white">0</p></div>
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl"><p class="text-[10px] text-gray-500">Выручка</p><p id="d-rev" class="text-2xl font-black text-yellow-400">0 с.</p></div>
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl"><p class="text-[10px] text-gray-500">Комиссия</p><p id="d-comm" class="text-2xl font-black text-emerald-400">0 с.</p></div>
      </div>
    </section>

    <section id="sec-rest" class="hidden space-y-4">
      <form id="add-rest-form" class="bg-gray-900 border border-gray-800 p-4 rounded-xl grid grid-cols-1 sm:grid-cols-3 gap-2">
        <input type="text" id="r-name" required placeholder="Название" class="bg-gray-950 p-2 rounded border border-gray-800 text-xs">
        <input type="text" id="r-addr" required placeholder="Адрес" class="bg-gray-950 p-2 rounded border border-gray-800 text-xs">
        <input type="number" id="r-comm" required value="10" placeholder="Комиссия %" class="bg-gray-950 p-2 rounded border border-gray-800 text-xs">
        <input type="email" id="r-email" required placeholder="Email" class="bg-gray-950 p-2 rounded border border-gray-800 text-xs">
        <input type="password" id="r-pass" required placeholder="Пароль" class="bg-gray-950 p-2 rounded border border-gray-800 text-xs">
        <button type="submit" class="bg-emerald-500 text-black font-bold rounded text-xs">Добавить</button>
      </form>
      <div id="admin-rest-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <section id="sec-prod" class="hidden space-y-4">
      <div id="admin-prod-list" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </section>

    <section id="sec-ord" class="hidden space-y-4">
      <div id="admin-ord-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <section id="sec-set" class="hidden space-y-4">
      <form id="settings-form" class="bg-gray-900 border border-gray-800 p-4 rounded-xl space-y-3">
        <input type="number" id="s-deliv" placeholder="Доставка" class="bg-gray-950 p-2 rounded w-full text-xs">
        <input type="number" id="s-min" placeholder="Мин. заказ" class="bg-gray-950 p-2 rounded w-full text-xs">
        <textarea id="s-about" placeholder="О нас" class="bg-gray-950 p-2 rounded w-full text-xs"></textarea>
        <button type="submit" class="bg-emerald-500 text-black px-4 py-2 rounded font-bold">Сохранить</button>
      </form>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, serverTimestamp, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM", authDomain: "peshras-delivery.firebaseapp.com", projectId: "peshras-delivery", storageBucket: "peshras-delivery.firebasestorage.app", messagingSenderId: "790787117044", appId: "1:790787117044:web:217ef1bea4edbab24873a1" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allR = [], allP = [], allO = [];

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } catch { alert('Ошибка'); }
};
window.logout = () => signOut(auth);

onAuthStateChanged(auth, u => {
  if (u) { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden'); init(); }
  else { document.getElementById('login-screen').classList.remove('hidden'); document.getElementById('app-screen').classList.add('hidden'); }
});

function init() {
  onSnapshot(collection(db, 'restaurants'), s => { allR = s.docs.map(d => ({id: d.id, ...d.data()})); renderR(); });
  onSnapshot(collection(db, 'products'), s => { allP = s.docs.map(d => ({id: d.id, ...d.data()})); renderP(); });
  onSnapshot(collection(db, 'orders'), s => { allO = s.docs.map(d => ({id: d.id, ...d.data()})); renderO(); renderDash(); });
}

document.getElementById('add-rest-form').onsubmit = async (e) => {
  e.preventDefault();
  const sec = initializeApp(firebaseConfig, 'sec'+Date.now());
  const sa = getAuth(sec);
  const cred = await createUserWithEmailAndPassword(sa, document.getElementById('r-email').value, document.getElementById('r-pass').value);
  await addDoc(collection(db, 'restaurants'), {
    name: document.getElementById('r-name').value, address: document.getElementById('r-addr').value,
    commission: Number(document.getElementById('r-comm').value), owner_uid: cred.user.uid, is_banned: false, created_at: serverTimestamp()
  });
  await signOut(sa); await deleteApp(sec); e.target.reset();
};

function renderR() {
  document.getElementById('admin-rest-list').innerHTML = allR.map(r => `
    <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl flex justify-between items-center text-xs">
      <div><b class="text-white">${r.name}</b> (${r.commission}%)<br><span class="text-gray-500">${r.address}</span></div>
      <div class="flex gap-1">
        <button onclick="updateDoc(doc(db,'restaurants','${r.id}'),{shift_open: ${r.shift_open===false}})" class="px-2 py-1 rounded ${r.shift_open===false?'bg-red-500/20 text-red-400':'bg-emerald-500/20 text-emerald-400'}">${r.shift_open===false?'Закрыт':'Открыт'}</button>
        <button onclick="deleteDoc(doc(db,'restaurants','${r.id}'))" class="text-red-400 px-1">✕</button>
      </div>
    </div>`).join('');
}

function renderP() {
  document.getElementById('admin-prod-list').innerHTML = allP.map(p => `
    <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-xs">
      <b class="text-white">${p.name}</b> — ${p.price} с.<br>
      <button onclick="deleteDoc(doc(db,'products','${p.id}'))" class="text-red-400 mt-2">Удалить</button>
    </div>`).join('');
}

function renderO() {
  document.getElementById('admin-ord-list').innerHTML = allO.map(o => `
    <div class="bg-gray-900 border border-gray-800 p-3 rounded-xl text-xs space-y-1">
      <div class="flex justify-between"><b>#${o.order_number}</b><span class="text-amber-400">${o.status}</span></div>
      <div class="text-gray-400">${o.client_name} · ${o.total_price} с.</div>
      <div class="flex justify-between items-center pt-2">
        <select onchange="updateDoc(doc(db,'orders','${o.id}'),{status:this.value})" class="bg-gray-950 p-1 rounded">
          <option value="new" ${o.status==='new'?'selected':''}>Новый</option>
          <option value="delivering" ${o.status==='delivering'?'selected':''}>В пути</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>Доставлен</option>
        </select>
        <button onclick="deleteDoc(doc(db,'orders','${o.id}'))" class="text-red-400">Удалить</button>
      </div>
    </div>`).join('');
}

function renderDash() {
  const today = new Date().setHours(0,0,0,0);
  const list = allO.filter(o => (o.created_at?.toMillis?.() || 0) >= today && o.status !== 'cancelled');
  const rev = list.reduce((s,o) => s + o.total_price, 0);
  const comm = list.reduce((s,o) => s + (o.commission_amount || 0), 0);
  document.getElementById('d-ord').textContent = list.length;
  document.getElementById('d-rev').textContent = rev + ' с.';
  document.getElementById('d-comm').textContent = comm + ' с.';
}

window.switchTab = t => {
  ['dash','rest','prod','ord','set'].forEach(x => {
    document.getElementById('sec-'+x).classList.toggle('hidden', x!==t);
    document.getElementById('tb-'+x).className = x===t ? 'text-yellow-400' : 'text-gray-400';
  });
};

document.getElementById('settings-form').onsubmit = async (e) => {
  e.preventDefault();
  await setDoc(doc(db, 'settings', 'config'), {
    delivery_price: Number(document.getElementById('s-deliv').value),
    min_order: Number(document.getElementById('s-min').value),
    about_text: document.getElementById('s-about').value
  }, { merge: true });
  alert('Сохранено');
};
</script>
</body>
</html>
