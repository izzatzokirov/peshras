<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peshras Admin — Панель Управления</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- ВХОД АДМИНИСТРАТОРА -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 rounded-2xl bg-yellow-400/10 text-yellow-400 mb-2 border border-yellow-400/20">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black text-white">Вход Администратора</h1>
                <p class="text-xs text-gray-400">Панель главного управления сервисом Peshras Delivery</p>
            </div>

            <form id="admin-login-form" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-gray-300">Email Админа</label>
                    <input type="email" id="admin-email" required placeholder="admin@peshras.tj" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 transition">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-gray-300">Пароль</label>
                    <input type="password" id="admin-password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 transition">
                </div>
                <div id="admin-error" class="text-xs text-red-400 hidden"></div>
                <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                    <span>Войти как Главный Управленец</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ АДМИНА -->
    <div id="admin-app" class="hidden min-h-screen flex flex-col">
        
        <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-lg font-black text-emerald-400">PESHRAS <span class="text-yellow-400 text-xs px-2 py-0.5 bg-yellow-400/10 rounded border border-yellow-400/20">SUPER ADMIN</span></span>
                </div>
                <button onclick="adminLogout()" class="text-gray-400 hover:text-red-400 p-2 transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 space-y-8">
            
            <!-- Навигация по вкладкам -->
            <div class="flex border-b border-gray-800 gap-6 text-sm font-bold overflow-x-auto pb-2">
                <button onclick="switchAdminTab('restaurants')" id="atab-restaurants" class="pb-3 border-b-2 border-yellow-400 text-yellow-400 flex items-center gap-2 whitespace-nowrap">
                    <i data-lucide="store" class="w-4 h-4"></i>
                    <span>Рестораны и Партнеры</span>
                </button>
                <button onclick="switchAdminTab('all-orders')" id="atab-orders" class="pb-3 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Все заказы города</span>
                </button>
            </div>

            <!-- ВКЛАДКА 1: УПРАВЛЕНИЕ РЕСТОРАНАМИ -->
            <section id="sec-restaurants" class="space-y-6">
                
                <!-- Форма добавления нового ресторана -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">
                    <h3 class="font-bold text-white text-base flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
                        <span>Добавить новый ресторан</span>
                    </h3>
                    
                    <form id="add-restaurant-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Название ресторана</label>
                            <input type="text" id="res-name" required placeholder="Например: Райхон" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Адрес заведения</label>
                            <input type="text" id="res-address" required placeholder="ул. И. Сомони 12" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Телефон</label>
                            <input type="text" id="res-phone" required placeholder="+992921234567" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Комиссия сервиса (%)</label>
                            <input type="number" id="res-commission" value="10" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Email (для входа партнеру)</label>
                            <input type="email" id="res-email" required placeholder="rayhon@peshras.tj" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-gray-400 font-semibold">Пароль аккаунта</label>
                            <input type="password" id="res-password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        
                        <div class="sm:col-span-2 lg:col-span-3 pt-2">
                            <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-6 py-2.5 rounded-xl transition text-xs flex items-center gap-2">
                                <span>Зарегистрировать ресторан</span>
                                <i data-lucide="check" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Список существующих ресторанов -->
                <div class="space-y-3">
                    <h4 class="font-bold text-white text-sm">Подключенные заведения:</h4>
                    <div id="admin-restaurants-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="text-gray-500 text-xs py-4">Загрузка заведений...</div>
                    </div>
                </div>

            </section>

            <!-- ВКЛАДКА 2: ВСЕ ЗАКАЗЫ ГОРОДА -->
            <section id="sec-orders" class="hidden space-y-4">
                <div id="admin-orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="text-gray-500 text-xs py-4">Загрузка заказов...</div>
                </div>
            </section>

        </main>
    </div>

    <!-- FIREBASE СКРИПТЫ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM",
          authDomain: "peshras-delivery.firebaseapp.com",
          projectId: "peshras-delivery",
          storageBucket: "peshras-delivery.firebasestorage.app",
          messagingSenderId: "790787117044",
          appId: "1:790787117044:web:217ef1bea4edbab24873a1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Вход админа
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                document.getElementById('admin-error').innerText = "Ошибка входа!";
                document.getElementById('admin-error').classList.remove('hidden');
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('admin-app').classList.remove('hidden');
                loadAdminRestaurants();
                listenAllOrders();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('admin-app').classList.add('hidden');
            }
            lucide.createIcons();
        });

        window.adminLogout = function() {
            signOut(auth);
        };

        // Загрузка всех ресторанов
        async function loadAdminRestaurants() {
            const container = document.getElementById('admin-restaurants-list');
            try {
                const snap = await getDocs(collection(db, "restaurants"));
                if (snap.empty) {
                    container.innerHTML = `<div class="text-gray-500 text-xs py-4 col-span-full">Ресторанов пока нет</div>`;
                    return;
                }
                container.innerHTML = '';
                snap.forEach((docSnap) => {
                    const res = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-extrabold text-white text-sm">${res.name}</h4>
                                <span class="text-xs bg-emerald-500/10 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/20">${res.commission || 10}% комиссия</span>
                            </div>
                            <p class="text-xs text-gray-400">📍 ${res.address} | 📞 ${res.phone}</p>
                            <div class="text-[11px] text-gray-500">ID: ${docSnap.id}</div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        // Загрузка всех заказов
        function listenAllOrders() {
            onSnapshot(collection(db, "orders"), (snap) => {
                const container = document.getElementById('admin-orders-list');
                if (snap.empty) {
                    container.innerHTML = `<div class="text-gray-500 text-xs py-4 col-span-full">Заказов пока нет</div>`;
                    return;
                }
                container.innerHTML = '';
                snap.forEach((docSnap) => {
                    const ord = docSnap.data();
                    container.innerHTML += `
                        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-white">Заказ #${docSnap.id.substring(0,6)}</span>
                                <span class="text-amber-400 font-bold">${ord.status}</span>
                            </div>
                            <div class="text-xs text-gray-300">Ресторан: ${ord.restaurant_name || ord.restaurant_id}</div>
                            <div class="text-xs font-bold text-yellow-400">Сумма: ${ord.total_price || 0} сомонӣ</div>
                        </div>
                    `;
                });
            });
        }

        window.switchAdminTab = function(tab) {
            document.getElementById('sec-restaurants').classList.toggle('hidden', tab !== 'restaurants');
            document.getElementById('sec-orders').classList.toggle('hidden', tab !== 'all-orders');
            document.getElementById('atab-restaurants').className = tab === 'restaurants' ? 'pb-3 border-b-2 border-yellow-400 text-yellow-400 flex items-center gap-2 whitespace-nowrap' : 'pb-3 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap';
            document.getElementById('atab-orders').className = tab === 'all-orders' ? 'pb-3 border-b-2 border-yellow-400 text-yellow-400 flex items-center gap-2 whitespace-nowrap' : 'pb-3 border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap';
        };

        lucide.createIcons();
    </script>
</body>
</html>
