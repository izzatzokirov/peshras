<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peshras Partner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  @keyframes pulse-border { 0%,100% { border-color: #f59e0b; } 50% { border-color: #fbbf24; box-shadow: 0 0 20px rgba(245,158,11,.3); } }
  .order-new { animation: pulse-border 1.5s infinite; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6">
    <h1 class="text-2xl font-black text-center text-white">Вход для ресторанов</h1>
    <form id="login-form" class="space-y-4">
      <input type="email" id="email" required placeholder="Email" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm">
      <input type="password" id="password" required placeholder="Пароль" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm">
      <div id="login-error" class="text-xs text-red-400 hidden"></div>
      <button type="submit" class="w-full bg-emerald-500 text-black font-extrabold py-3.5 rounded-xl">Войти</button>
    </form>
  </div>
</div>

<div id="app-screen" class="hidden min-h-screen flex flex-col">
  <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <span id="restaurant-name-heading" class="text-lg font-black text-white truncate">Загрузка...</span>
      <div class="flex gap-2">
        <button id="shift-btn" onclick="toggleShift()" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-gray-800">Смена</button>
        <button id="sound-btn" onclick="toggleSound()" class="bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-xl text-xs"><i data-lucide="bell" class="w-4 h-4"></i></button>
        <button onclick="logout()" class="text-gray-400 p-1"><i data-lucide="log-out" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 space-y-6">
    <div class="flex border-b border-gray-800 gap-6 text-sm font-bold">
      <button onclick="switchTab('orders')" id="tab-btn-orders" class="pb-3 border-b-2 border-emerald-500 text-emerald-400">Заказы <span id="active-orders-count" class="bg-emerald-500/20 px-2 py-0.5 rounded-full">0</span></button>
      <button onclick="switchTab('menu')" id="tab-btn-menu" class="pb-3 border-b-2 border-transparent text-gray-400">Меню</button>
      <button onclick="switchTab('stats')" id="tab-btn-stats" class="pb-3 border-b-2 border-transparent text-gray-400">Статистика</button>
    </div>

    <section id="tab-orders">
      <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="text-gray-500 text-xs col-span-full text-center py-8">Загрузка...</div>
      </div>
    </section>

    <section id="tab-menu" class="hidden space-y-6">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">
        <h3 class="font-bold text-white text-sm">Добавить блюдо</h3>
        <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <input type="text" id="prod-name" required placeholder="Название" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
          <input type="number" id="prod-price" required placeholder="Цена (с.)" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
          <input type="url" id="prod-img" required placeholder="Ссылка на фото" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
          <select id="prod-category" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
            <option value="plov">Плов</option><option value="shashlik">Шашлык</option><option value="pizza">Пицца</option><option value="burger">Бургеры</option><option value="fastfood">Фастфуд</option><option value="soup">Супы</option><option value="salad">Салаты</option><option value="bakery">Выпечка</option><option value="dessert">Десерты</option><option value="drinks">Напитки</option><option value="other">Другое</option>
          </select>
          <textarea id="prod-desc" rows="1" placeholder="Описание" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></textarea>
          <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="prod-instock" checked> В наличии</label>
          <button type="submit" class="bg-emerald-500 text-black font-bold px-4 py-2 rounded-xl text-xs">Добавить</button>
        </form>
      </div>
      <div id="menu-management-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <section id="tab-stats" class="hidden space-y-4">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] text-gray-500">Заказов</p><p id="st-orders" class="text-2xl font-black text-white">0</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] text-gray-500">Выручка</p><p id="st-revenue" class="text-xl font-black text-yellow-400">0 с.</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] text-gray-500">Комиссия</p><p id="st-commission" class="text-xl font-black text-red-400">0 с.</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] text-gray-500">Вам к выплате</p><p id="st-payout" class="text-xl font-black text-emerald-400">0 с.</p></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM", authDomain: "peshras-delivery.firebaseapp.com", projectId: "peshras-delivery", storageBucket: "peshras-delivery.firebasestorage.app", messagingSenderId: "790787117044", appId: "1:790787117044:web:217ef1bea4edbab24873a1" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentRestaurantId = null, currentRestaurant = null;
let soundEnabled = false, unsubOrders = null, allOrders = [], seen = new Set();
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' с.';

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
  catch { document.getElementById('login-error').classList.remove('hidden'); document.getElementById('login-error').textContent='Ошибка'; }
};
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (u) => {
  if (!u) { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('app-screen').classList.add('hidden'); return; }
  document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app-screen').classList.remove('hidden');
  
  const snap = await getDocs(query(collection(db, 'restaurants'), where('owner_uid', '==', u.uid)));
  if (snap.empty) { alert('Нет ресторана'); return; }
  const d = snap.docs[0];
  currentRestaurantId = d.id; currentRestaurant = { id: d.id, ...d.data() };
  document.getElementById('restaurant-name-heading').textContent = currentRestaurant.name;
  updateShiftUI(); listenOrders(); loadMenu();
});

function updateShiftUI() {
  const btn = document.getElementById('shift-btn');
  if (currentRestaurant.shift_open !== false) { btn.className = 'text-xs font-bold px-3 py-1.5 rounded-xl bg-emerald-500 text-black'; btn.textContent = '🟢 Открыт'; }
  else { btn.className = 'text-xs font-bold px-3 py-1.5 rounded-xl bg-red-500 text-white'; btn.textContent = '🔴 Закрыт'; }
}
window.toggleShift = async () => {
  const open = currentRestaurant.shift_open === false;
  if (!confirm(open ? 'Открыть?' : 'Закрыть?')) return;
  await updateDoc(doc(db, 'restaurants', currentRestaurantId), { shift_open: open });
  currentRestaurant.shift_open = open; updateShiftUI();
};
window.toggleSound = () => {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-btn').className = soundEnabled ? 'bg-emerald-500 text-black px-3 py-1.5 rounded-xl' : 'bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-xl';
  if (soundEnabled) beep();
};
function beep() {
  if (!soundEnabled) return;
  try { const ctx = new AudioContext(); const o = ctx.createOscillator(); o.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.5); } catch(e){}
}

function listenOrders() {
  if (unsubOrders) unsubOrders();
  unsubOrders = onSnapshot(query(collection(db, 'orders'), where('restaurant_id', '==', currentRestaurantId)), snap => {
    allOrders = []; let newCount = 0, hasNew = false;
    snap.forEach(d => { const o = { id: d.id, ...d.data() }; allOrders.push(o); if(o.status==='new'){ newCount++; if(!seen.has(o.id)) hasNew=true; } seen.add(o.id); });
    allOrders.sort((a,b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
    document.getElementById('active-orders-count').textContent = allOrders.filter(o=>['new','accepted','cooking','delivering'].includes(o.status)).length;
    if (hasNew) beep();
    renderOrders();
  });
}

function renderOrders() {
  const el = document.getElementById('orders-list');
  if (!allOrders.length) { el.innerHTML = `<div class="text-gray-500 col-span-full text-center py-8">Нет заказов</div>`; return; }
  el.innerHTML = allOrders.map(o => {
    let btns = '';
    if (o.status === 'new') btns = `<button onclick="upd('${o.id}','accepted')" class="flex-1 bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs">Принять</button><button onclick="upd('${o.id}','cancelled')" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-xl text-xs">Отмена</button>`;
    else if (o.status === 'accepted') btns = `<button onclick="upd('${o.id}','cooking')" class="flex-1 bg-blue-500 text-white font-bold py-2 rounded-xl text-xs">Готовить</button>`;
    else if (o.status === 'cooking') btns = `<button onclick="upd('${o.id}','delivering')" class="flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl text-xs">Курьеру</button>`;
    else if (o.status === 'delivering') btns = `<div class="flex-1 text-center bg-purple-500/10 text-purple-400 py-2 rounded-xl text-xs">Ожидает доставки</div>`;

    return `
      <div class="bg-gray-900 border ${o.status==='new'?'border-amber-500 order-new':'border-gray-800'} rounded-2xl p-4 space-y-2 text-xs">
        <div class="flex justify-between font-bold text-gray-400"><span>#${o.order_number || o.id.substring(0,6)}</span><span class="text-amber-400">${o.status}</span></div>
        <div class="text-white font-bold text-sm">${o.client_name} (${o.client_phone})</div>
        <div class="text-gray-400">${o.delivery_address}</div>
        <div class="bg-gray-950 p-2 rounded border border-gray-800">${(o.items||[]).map(i=>`<div class="flex justify-between"><span>${i.name}</span><span>×${i.qty}</span></div>`).join('')}</div>
        <div class="flex justify-between items-center font-black text-yellow-400 text-sm pt-1"><span>Итого:</span><span>${fmt(o.total_price)}</span></div>
        <div class="flex gap-2 pt-1">${btns}</div>
      </div>`;
  }).join('');
}
window.upd = async (id, status) => {
  if (confirm('Сменить статус?')) await updateDoc(doc(db, 'orders', id), { status });
};

document.getElementById('add-product-form').onsubmit = async (e) => {
  e.preventDefault();
  await addDoc(collection(db, 'products'), {
    name: document.getElementById('prod-name').value, price: Number(document.getElementById('prod-price').value),
    image_url: document.getElementById('prod-img').value, category: document.getElementById('prod-category').value,
    description: document.getElementById('prod-desc').value, in_stock: document.getElementById('prod-instock').checked,
    restaurant_id: currentRestaurantId, is_hit: false, is_popular: false, is_new: false, created_at: serverTimestamp()
  });
  e.target.reset(); loadMenu();
};

async function loadMenu() {
  const el = document.getElementById('menu-management-list');
  const snap = await getDocs(query(collection(db, 'products'), where('restaurant_id', '==', currentRestaurantId)));
  if (snap.empty) { el.innerHTML = 'Нет блюд'; return; }
  el.innerHTML = snap.docs.map(d => {
    const p = d.data();
    return `<div class="bg-gray-900 border border-gray-800 rounded-xl p-3 flex justify-between items-center">
      <div class="text-xs text-white">${p.name} <span class="text-yellow-400">${p.price} с.</span></div>
      <button onclick="updateDoc(doc(db, 'products', '${d.id}'), {in_stock: ${p.in_stock === false}}) ; loadMenu()" class="text-[10px] px-2 py-1 rounded ${p.in_stock!==false?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400'}">${p.in_stock!==false?'В наличии':'Стоп'}</button>
    </div>`;
  }).join('');
}

window.switchTab = t => {
  ['orders','menu','stats'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('hidden', x!==t);
    document.getElementById('tab-btn-'+x).className = x===t ? 'pb-3 border-b-2 border-emerald-500 text-emerald-400' : 'pb-3 border-b-2 border-transparent text-gray-400';
  });
  if (t==='stats') renderStats();
};
window.renderStats = () => {
  let sum=0, comm=0;
  allOrders.filter(o=>o.status==='delivered').forEach(o=> { sum+=o.total_price; comm+=o.commission_amount || (o.total_price*(currentRestaurant.commission||0)/100); });
  document.getElementById('st-orders').textContent = allOrders.filter(o=>o.status==='delivered').length;
  document.getElementById('st-revenue').textContent = fmt(sum);
  document.getElementById('st-commission').textContent = fmt(comm);
  document.getElementById('st-payout').textContent = fmt(sum-comm);
};
lucide.createIcons();
</script>
</body>
</html>
