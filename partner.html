<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peshras Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<header class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <span class="text-lg font-black text-emerald-400">PESHRAS <span class="text-red-400 text-xs">ADMIN</span></span>
    <button onclick="logout()" class="text-gray-400 hover:text-red-400 p-2"><i data-lucide="log-out" class="w-5 h-5"></i></button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

  <div class="flex border-b border-gray-800 gap-6 text-sm font-bold">
    <button onclick="switchTab('restaurants')" id="tb-r" class="pb-3 border-b-2 border-emerald-500 text-emerald-400">Рестораны</button>
    <button onclick="switchTab('orders')" id="tb-o" class="pb-3 border-b-2 border-transparent text-gray-400">Все заказы</button>
  </div>

  <!-- РЕСТОРАНЫ -->
  <section id="tab-restaurants" class="space-y-6">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4">
      <h3 class="font-bold text-white text-sm flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Регистрация нового ресторана
      </h3>
      <form id="add-rest-form" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="text-[11px] text-gray-400">Название *</label>
          <input required id="r-name" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="text-[11px] text-gray-400">Адрес *</label>
          <input required id="r-address" placeholder="ул. Ленина 15" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="text-[11px] text-gray-400">Логотип (URL)</label>
          <input id="r-logo" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="text-[11px] text-gray-400">Кухня</label>
          <input id="r-cuisine" placeholder="Национальная" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="text-[11px] text-gray-400">Телефон</label>
          <input id="r-phone" placeholder="+992..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div><label class="text-[11px] text-gray-400">Комиссия (%) — опционально</label>
          <input id="r-commission" type="number" placeholder="10" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div class="sm:col-span-2"><label class="text-[11px] text-gray-400">UID владельца (из Firebase Auth) *</label>
          <input required id="r-uid" placeholder="Создайте пользователя в Firebase Console → Authentication → Add user → скопируйте UID"
            class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs"></div>
        <div class="sm:col-span-2">
          <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-5 py-2.5 rounded-xl text-xs">Создать ресторан</button>
        </div>
      </form>
    </div>

    <div>
      <h4 class="font-bold text-white text-sm mb-3">Все рестораны:</h4>
      <div id="restaurants-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>
  </section>

  <!-- ЗАКАЗЫ -->
  <section id="tab-orders" class="hidden">
    <div id="all-orders" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, serverTimestamp, doc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM",
  authDomain: "peshras-delivery.firebaseapp.com",
  projectId: "peshras-delivery",
  storageBucket: "peshras-delivery.firebasestorage.app",
  messagingSenderId: "790787117044",
  appId: "1:790787117044:web:217ef1bea4edbab24873a1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' сомонӣ';

// Простейшая авторизация админа через тот же Firebase Auth
onAuthStateChanged(auth, user => {
  if (!user) {
    const email = prompt('Email администратора:');
    const pass = prompt('Пароль:');
    if (email && pass) signInWithEmailAndPassword(auth, email, pass).catch(() => alert('Ошибка входа'));
  } else {
    loadRestaurants();
    loadAllOrders();
  }
});
window.logout = () => signOut(auth);

/* Регистрация ресторана */
document.getElementById('add-rest-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await addDoc(collection(db, 'restaurants'), {
      name: document.getElementById('r-name').value.trim(),
      address: document.getElementById('r-address').value.trim(),
      logo_url: document.getElementById('r-logo').value.trim(),
      cuisine: document.getElementById('r-cuisine').value.trim(),
      phone: document.getElementById('r-phone').value.trim(),
      commission: document.getElementById('r-commission').value ? Number(document.getElementById('r-commission').value) : null,
      owner_uid: document.getElementById('r-uid').value.trim(),
      created_at: serverTimestamp()
    });
    e.target.reset();
    alert('✅ Ресторан создан');
  } catch (err) { console.error(err); alert('Ошибка'); }
});

function loadRestaurants() {
  onSnapshot(collection(db, 'restaurants'), snap => {
    const list = document.getElementById('restaurants-list');
    if (snap.empty) { list.innerHTML = `<p class="text-gray-500 text-xs">Пока нет ресторанов</p>`; return; }
    list.innerHTML = snap.docs.map(d => {
      const r = d.data();
      return `
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-gray-800 overflow-hidden flex-shrink-0">
            ${r.logo_url ? `<img src="${esc(r.logo_url)}" class="w-full h-full object-cover">` : ''}
          </div>
          <div class="min-w-0 flex-1">
            <p class="font-bold text-sm text-white truncate">${esc(r.name)}</p>
            <p class="text-[10px] text-gray-500 truncate">${esc(r.address || '')}</p>
            <p class="text-[10px] text-gray-600 truncate">UID: ${esc(r.owner_uid || '—')}</p>
          </div>
          <button onclick="delRest('${d.id}')" class="text-red-400 hover:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  });
}
window.delRest = async function (id) {
  if (!confirm('Удалить ресторан?')) return;
  await deleteDoc(doc(db, 'restaurants', id));
};

function loadAllOrders() {
  onSnapshot(collection(db, 'orders'), snap => {
    const list = document.getElementById('all-orders');
    const arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    arr.sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
    if (!arr.length) { list.innerHTML = `<p class="text-gray-500 text-xs">Пока нет заказов</p>`; return; }
    list.innerHTML = arr.map(o => `
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-3 space-y-1 text-xs">
        <div class="flex justify-between"><span class="text-gray-400 font-mono">#${o.id.substring(0,6)}</span>
          <span class="text-emerald-400 font-bold">${o.status}</span></div>
        <p class="text-white font-bold">${esc(o.client_name)} · ${esc(o.client_phone)}</p>
        <p class="text-gray-400">${esc(o.delivery_address)}</p>
        <p class="text-yellow-400 font-black">${fmt(o.total_price)}</p>
      </div>
    `).join('');
  });
}

window.switchTab = (t) => {
  document.getElementById('tab-restaurants').classList.toggle('hidden', t !== 'restaurants');
  document.getElementById('tab-orders').classList.toggle('hidden', t !== 'orders');
  const a = 'pb-3 border-b-2 border-emerald-500 text-emerald-400';
  const i = 'pb-3 border-b-2 border-transparent text-gray-400';
  document.getElementById('tb-r').className = t === 'restaurants' ? a : i;
  document.getElementById('tb-o').className = t === 'orders' ? a : i;
};

lucide.createIcons();
</script>
</body>
</html>
