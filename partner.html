<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Peshras Partner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes pulse-border { 0%, 100% { border-color: #f59e0b; box-shadow: 0 0 0 0 rgba(245,158,11,.4); } 50% { border-color: #fbbf24; box-shadow: 0 0 24px 2px rgba(245,158,11,.35); } }
  .order-new { animation: pulse-border 1.8s infinite; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { animation: slideIn .35s ease-out; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 w-full max-w-md space-y-6 shadow-2xl anim-in">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-emerald-500/10 text-emerald-400 mb-2 border border-emerald-500/20"><i data-lucide="store" class="w-10 h-10"></i></div>
      <h1 class="text-2xl font-black text-white">Вход для ресторанов</h1>
      <p class="text-sm text-gray-400">Данные выдаёт администрация Peshras</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div><label class="text-xs font-semibold text-gray-400">Email</label><input type="email" id="email" required placeholder="restaurant@peshras.online" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></div>
      <div><label class="text-xs font-semibold text-gray-400">Пароль</label><input type="password" id="password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></div>
      <div id="login-error" class="text-xs text-red-400 hidden"></div>
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-4 rounded-xl text-lg transition">Войти</button>
    </form>
  </div>
</div>

<!-- КАБИНЕТ -->
<div id="app-screen" class="hidden min-h-screen flex flex-col">
  <header class="bg-gray-900 border-b border-gray-800 px-4 py-4 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <span class="text-xl font-black text-emerald-400 whitespace-nowrap hidden sm:block">PESHRAS</span>
        <span id="restaurant-name-heading" class="text-lg sm:text-sm bg-gray-800 text-white px-4 py-1.5 rounded-xl font-bold border border-gray-700 truncate">Загрузка...</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="shift-toggle" onclick="toggleShift()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition active:scale-95"><i data-lucide="clock" class="w-5 h-5"></i><span id="shift-status-text">Смена</span></button>
        <button onclick="logout()" class="text-gray-400 hover:text-red-400 p-2 transition"><i data-lucide="log-out" class="w-6 h-6"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 space-y-6">
    <div class="flex border-b border-gray-800 gap-4 sm:gap-8 text-base font-bold overflow-x-auto scrollbar-none">
      <button onclick="switchTab('orders')" id="tab-btn-orders" class="tab pb-4 border-b-4 border-emerald-500 text-emerald-400 flex items-center gap-2 whitespace-nowrap"><i data-lucide="utensils" class="w-5 h-5"></i><span>Заказы</span><span id="active-orders-count" class="bg-emerald-500 text-black text-xs px-2 py-0.5 rounded-full">0</span></button>
      <button onclick="switchTab('menu')" id="tab-btn-menu" class="tab pb-4 border-b-4 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap"><i data-lucide="list-checks" class="w-5 h-5"></i><span>Меню</span></button>
      <button onclick="switchTab('stats')" id="tab-btn-stats" class="tab pb-4 border-b-4 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap"><i data-lucide="bar-chart-3" class="w-5 h-5"></i><span>Статистика</span></button>
    </div>

    <section id="tab-orders" class="space-y-4">
      <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"><div class="text-gray-500 text-sm col-span-full py-8 text-center">Загрузка заказов...</div></div>
    </section>

    <section id="tab-menu" class="hidden space-y-6">
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 space-y-4">
        <h3 class="font-black text-white text-lg">Добавить новое блюдо</h3>
        <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="sm:col-span-2"><label class="text-xs text-gray-400 font-bold">Название *</label><input type="text" id="prod-name" required placeholder="Плов по-исфарински" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></div>
          <div><label class="text-xs text-gray-400 font-bold">Цена (сомонӣ) *</label><input type="number" id="prod-price" min="1" step="0.01" required placeholder="35" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></div>
          <div class="sm:col-span-2"><label class="text-xs text-gray-400 font-bold">Ссылка на фото *</label><input type="url" id="prod-img" required placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none"></div>
          <div><label class="text-xs text-gray-400 font-bold">Категория *</label><select id="prod-category" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none text-gray-300"><option value="plov">🍚 Плов</option><option value="shashlik">🍢 Шашлык</option><option value="pizza">🍕 Пицца</option><option value="burger">🍔 Бургеры</option><option value="fastfood">🌭 Фастфуд</option><option value="soup">🍲 Супы</option><option value="salad">🥗 Салаты</option><option value="bakery">🥐 Выпечка</option><option value="dessert">🍰 Десерты</option><option value="drinks">🥤 Напитки</option><option value="other">🍽 Другое</option></select></div>
          <div class="sm:col-span-2 lg:col-span-3"><label class="text-xs text-gray-400 font-bold">Описание</label><textarea id="prod-desc" rows="2" placeholder="Состав, вес, порции" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 focus:outline-none resize-none"></textarea></div>
          <div class="sm:col-span-2 lg:col-span-3"><label class="flex items-center gap-3 text-sm text-gray-300 font-bold cursor-pointer"><input type="checkbox" id="prod-instock" checked class="w-5 h-5 accent-emerald-500"><span>В наличии сейчас</span></label></div>
          <div class="sm:col-span-2 lg:col-span-3 pt-2"><button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-black font-black px-8 py-4 rounded-xl transition text-base shadow-lg w-full sm:w-auto">Добавить блюдо</button></div>
        </form>
      </div>
      <div class="space-y-4">
        <h4 class="font-bold text-white text-lg">Ваше меню:</h4>
        <div id="menu-management-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="text-gray-500 text-sm py-4 col-span-full">Загрузка...</div></div>
      </div>
    </section>

    <section id="tab-stats" class="hidden space-y-6">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5"><p class="text-xs text-gray-500 uppercase font-bold">Заказов</p><p id="st-orders" class="text-3xl font-black text-white mt-1">0</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5"><p class="text-xs text-gray-500 uppercase font-bold">Выручка</p><p id="st-revenue" class="text-2xl font-black text-yellow-400 mt-1">0 с.</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5"><p class="text-xs text-gray-500 uppercase font-bold">Комиссия</p><p id="st-commission" class="text-2xl font-black text-red-400 mt-1">0 с.</p></div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5"><p class="text-xs text-gray-500 uppercase font-bold">Вам к выплате</p><p id="st-payout" class="text-2xl font-black text-emerald-400 mt-1">0 с.</p></div>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6"><h4 class="font-bold text-white text-lg mb-4">Топ блюд</h4><div id="st-top-items" class="space-y-3 text-sm"><p class="text-gray-500">Нет данных</p></div></div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM", authDomain: "peshras-delivery.firebaseapp.com", projectId: "peshras-delivery", storageBucket: "peshras-delivery.firebasestorage.app", messagingSenderId: "790787117044", appId: "1:790787117044:web:217ef1bea4edbab24873a1" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

const $ = s => document.querySelector(s); const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' с.';

let audioContext = null, currentRestaurantId = null, currentRestaurant = null, unsubscribeOrders = null, allOrders = [], allProducts = [], activeCount = 0, soundEnabled = true;

function playAlertSound() {
  if (!soundEnabled) return;
  try {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioContext.currentTime;
    for(let i=0; i<3; i++){
      const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(880, now + i * 0.4);
      gain.gain.setValueAtTime(0.8, now + i * 0.4); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.4 + 0.3);
      osc.connect(gain); gain.connect(audioContext.destination); osc.start(now + i * 0.4); osc.stop(now + i * 0.4 + 0.3);
    }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
}

$('#login-form').addEventListener('submit', async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, $('#email').value, $('#password').value); } catch { $('#login-error').classList.remove('hidden'); $('#login-error').textContent='Неверный логин или пароль'; } });
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) { $('#auth-screen').classList.remove('hidden'); $('#app-screen').classList.add('hidden'); return; }
  $('#auth-screen').classList.add('hidden'); $('#app-screen').classList.remove('hidden');
  const snap = await getDocs(query(collection(db, 'restaurants'), where('owner_uid', '==', user.uid)));
  if (snap.empty) { alert('Аккаунт не привязан.'); return; }
  const d = snap.docs[0]; currentRestaurantId = d.id; currentRestaurant = { id: d.id, ...d.data() };
  $('#restaurant-name-heading').innerText = currentRestaurant.name || 'Ресторан'; 
  updateShiftUI(); listenOrders(); loadMenu(); lucide.createIcons();
});

function updateShiftUI() {
  const isOpen = currentRestaurant?.shift_open !== false;
  const btn = $('#shift-toggle');
  if (isOpen) { btn.className = 'flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-black'; btn.innerHTML = '<i data-lucide="clock" class="w-5 h-5"></i><span>🟢 Смена открыта</span>'; }
  else { btn.className = 'flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold bg-red-500 text-white'; btn.innerHTML = '<i data-lucide="clock" class="w-5 h-5"></i><span>🔴 Смена закрыта</span>'; }
  lucide.createIcons();
}

window.toggleShift = async () => {
  const isOpen = currentRestaurant.shift_open !== false; const newState = !isOpen;
  if (!confirm(newState ? 'Открыть смену?' : 'Закрыть смену?')) return;
  await updateDoc(doc(db, 'restaurants', currentRestaurantId), { shift_open: newState }); 
  currentRestaurant.shift_open = newState; updateShiftUI();
  if(newState) playAlertSound();
};

const STATUS_LABEL = { new: '🆕 Новый', accepted: '✅ Принят', cooking: '🍳 Готовится', delivering: '🛵 В пути', courier_accepted: '🛵 У курьера', delivered: '🏁 Доставлен', cancelled: '❌ Отменён' };

function listenOrders() {
  if (unsubscribeOrders) unsubscribeOrders();
  unsubscribeOrders = onSnapshot(query(collection(db, 'orders'), where('restaurant_id', '==', currentRestaurantId)), (snap) => {
    allOrders = []; snap.forEach(d => allOrders.push({ id: d.id, ...d.data() })); allOrders.sort((a, b) => (b.created_at?.toMillis?.() || 0) - (a.created_at?.toMillis?.() || 0));
    let hasNew = false; activeCount = 0;
    allOrders.forEach(o => { if(['new','accepted','cooking','courier_accepted','delivering'].includes(o.status)) activeCount++; if (o.status === 'new') hasNew = true; });
    $('#active-orders-count').innerText = activeCount;
    if (hasNew) playAlertSound();
    renderOrders();
  });
}

function renderOrders() {
  const container = $('#orders-list'); 
  let list = allOrders.filter(o => ['new','accepted','cooking','courier_accepted','delivering'].includes(o.status));
  if (!list.length) { container.innerHTML = `<div class="text-gray-500 text-sm col-span-full py-8 text-center">Нет активных заказов</div>`; return; }
  
  container.innerHTML = list.map(o => {
    const itemsHTML = (o.items || []).map(it => `<div class="flex justify-between text-sm"><span class="text-gray-300">${esc(it.name)}</span><span class="text-white font-bold">×${it.qty}</span></div>`).join('');
    
    const statusBtns = [];
    if (o.status === 'new') {
      statusBtns.push(`<button onclick="updateStatus('${o.id}','accepted')" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-black font-black py-4 rounded-2xl text-base transition">Принять</button>`);
      statusBtns.push(`<button onclick="updateStatus('${o.id}','cancelled')" class="bg-red-500/20 text-red-400 font-bold px-4 py-4 rounded-2xl text-base">Отмена</button>`);
    } else if (o.status === 'accepted') {
      statusBtns.push(`<button onclick="updateStatus('${o.id}','cooking')" class="flex-1 bg-blue-500 hover:bg-blue-400 text-white font-black py-4 rounded-2xl text-base transition">Еда готова</button>`);
    } else if (o.status === 'cooking') {
      if (!o.courier_id) {
        statusBtns.push(`<button onclick="retrySearchCourier('${o.id}')" class="flex-1 bg-amber-500 hover:bg-amber-400 text-black font-black py-4 rounded-2xl text-base transition flex items-center justify-center gap-2"><i data-lucide="refresh-cw" class="w-5 h-5"></i> Ищем курьера (повтор)</button>`);
      }
      statusBtns.push(`<button onclick="updateStatus('${o.id}','delivering')" class="bg-blue-500/20 text-blue-400 font-bold px-4 py-4 rounded-2xl text-base" title="Нажать только если курьер уже забрал">Передать курьеру</button>`);
    } else if (o.status === 'courier_accepted') {
      statusBtns.push(`<div class="flex-1 text-center bg-amber-500/20 border border-amber-500/40 text-amber-400 font-black py-4 rounded-2xl text-base">🛵 Курьер уже едет к вам</div>`);
      statusBtns.push(`<button onclick="updateStatus('${o.id}','delivering')" class="bg-blue-500 text-white font-black px-4 py-4 rounded-2xl text-base">Передать</button>`);
    } else if (o.status === 'delivering') {
      statusBtns.push(`<div class="flex-1 text-center bg-purple-500/20 border border-purple-500/40 text-purple-400 font-black py-4 rounded-2xl text-base">🛵 Заказ у курьера</div>`);
    }

    return `
      <div class="bg-gray-900 border ${o.status === 'new' ? 'border-amber-500 order-new' : 'border-gray-800'} rounded-3xl p-5 space-y-4 shadow-lg">
        <div class="flex justify-between items-center">
          <span class="text-lg font-black text-white">#${o.order_number || o.id.substring(0, 6)}</span>
          <span class="font-bold px-3 py-1 rounded-lg ${o.status === 'new' ? 'bg-amber-500 text-black' : 'bg-gray-800 text-emerald-400'} text-sm">${STATUS_LABEL[o.status] || o.status}</span>
        </div>
        <div class="space-y-1">
          <div class="text-white font-black text-xl">${esc(o.client_name || 'Клиент')}</div>
          <div class="text-gray-300 font-bold text-sm">📞 <a href="tel:${esc(o.client_phone)}" class="hover:text-emerald-400">${esc(o.client_phone || '—')}</a></div>
          <div class="text-gray-300 text-sm">📍 ${esc(o.delivery_address || '—')}</div>
          <div class="text-sm font-bold ${o.payment_method === 'cash' ? 'text-amber-400' : 'text-blue-400'} mt-1">
            ${o.payment_method === 'cash' ? '💵 Оплата наличными' : '💳 Оплата онлайн'}
          </div>
          ${o.comment ? `<div class="text-amber-400 bg-amber-500/10 rounded-xl p-3 mt-2 text-sm font-bold">💬 ${esc(o.comment)}</div>` : ''}
        </div>
        <div class="bg-gray-950 rounded-2xl p-4 space-y-2 border border-gray-800">${itemsHTML}</div>
        <div class="flex justify-between items-center pt-2 border-t border-gray-800">
          <span class="text-sm text-gray-400 font-bold">Итого:</span>
          <span class="text-yellow-400 font-black text-2xl">${fmt(o.total_price)}</span>
        </div>
        <div class="flex gap-3 pt-2">${statusBtns.join('')}</div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

window.updateStatus = async (orderId, status) => { 
  if (!confirm(`Сменить статус на "${STATUS_LABEL[status]}"?`)) return;
  try { await updateDoc(doc(db, 'orders', orderId), { status }); } catch (e) { alert('Ошибка'); }
};

window.retrySearchCourier = async (orderId) => {
  const sure = confirm('Отправить повторное уведомление всем курьерам?');
  if (!sure) return;
  try {
    await updateDoc(doc(db, 'orders', orderId), { searching_courier: Date.now() });
    alert('Повторный поиск курьера запущен!');
  } catch(e) { alert('Ошибка'); }
};

$('#add-product-form').addEventListener('submit', async (e) => {
  e.preventDefault(); const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Добавляем...';
  try { await addDoc(collection(db, 'products'), { name: $('#prod-name').value.trim(), price: Number($('#prod-price').value), image_url: $('#prod-img').value.trim(), description: $('#prod-desc').value.trim(), category: $('#prod-category').value, restaurant_id: currentRestaurantId, in_stock: $('#prod-instock').checked, is_hit: false, is_popular: false, is_new: false, created_at: serverTimestamp() }); e.target.reset(); $('#prod-instock').checked = true; await loadMenu(); alert('Блюдо добавлено'); } catch (err) { alert('Ошибка'); } finally { btn.disabled = false; btn.textContent = 'Добавить блюдо'; }
});

async function loadMenu() {
  const container = $('#menu-management-list'); const snap = await getDocs(query(collection(db, 'products'), where('restaurant_id', '==', currentRestaurantId)));
  allProducts = []; snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
  if (!allProducts.length) { container.innerHTML = `<div class="text-gray-500 text-sm py-4 col-span-full">Нет блюд</div>`; return; }
  const CAT = { plov:'🍚 Плов', shashlik:'🍢 Шашлык', pizza:'🍕 Пицца', burger:'🍔 Бургеры', fastfood:'🌭 Фастфуд', soup:'🍲 Супы', salad:'🥗 Салаты', bakery:'🥐 Выпечка', dessert:'🍰 Десерты', drinks:'🥤 Напитки', other:'🍽 Другое' };
  container.innerHTML = allProducts.map(p => { const inStock = p.in_stock !== false; return `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex items-center justify-between gap-4"><div class="flex items-center gap-4 min-w-0 flex-1"><img src="${esc(p.image_url)}" class="w-16 h-16 object-cover rounded-xl bg-gray-800 flex-shrink-0"><div class="min-w-0"><h4 class="font-bold text-base text-white truncate">${esc(p.name)}</h4><div class="text-sm text-yellow-400 font-black mt-1">${p.price} с.</div><div class="text-xs text-gray-500">${CAT[p.category] || '—'}</div></div></div><div class="flex flex-col gap-2"><button onclick="toggleStock('${p.id}', ${!inStock}, this)" class="px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${inStock ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">${inStock ? 'В наличии' : 'Стоп-лист'}</button><button onclick="delProd('${p.id}')" class="px-3 py-2 rounded-xl text-xs bg-red-500/20 text-red-400 font-bold">Удалить</button></div></div>`; }).join('');
  lucide.createIcons();
}

window.toggleStock = async (id, s, btn) => { if (!confirm(s ? 'Вернуть?' : 'В стоп-лист?')) return; btn.disabled = true; try { await updateDoc(doc(db, 'products', id), { in_stock: s }); await loadMenu(); } catch (e) { alert('Ошибка'); } };
window.delProd = async (id) => { if (!confirm('Удалить блюдо?')) return; try { await deleteDoc(doc(db, 'products', id)); await loadMenu(); } catch (e) { alert('Ошибка'); } };

window.switchTab = t => {
  ['orders','menu','stats'].forEach(x => { document.getElementById('tab-'+x).classList.toggle('hidden', x!==t); document.getElementById('tab-btn-'+x).className = x===t ? 'tab pb-4 border-b-4 border-emerald-500 text-emerald-400 flex items-center gap-2 whitespace-nowrap' : 'tab pb-4 border-b-4 border-transparent text-gray-400 hover:text-gray-200 flex items-center gap-2 whitespace-nowrap'; });
  if (t==='stats') renderStats(); lucide.createIcons();
};

window.renderStats = () => {
  const delivered = allOrders.filter(o=>o.status==='delivered');
  let sum=0, comm=0;
  delivered.forEach(o=> { sum+=o.total_price; comm+=o.commission_amount || (o.total_price*(currentRestaurant.commission||0)/100); });
  document.getElementById('st-orders').textContent = delivered.length;
  document.getElementById('st-revenue').textContent = fmt(sum);
  document.getElementById('st-commission').textContent = fmt(comm);
  document.getElementById('st-payout').textContent = fmt(sum-comm);
  const items = {}; delivered.forEach(o => (o.items || []).forEach(it => { if (!items[it.name]) items[it.name] = { qty: 0, sum: 0 }; items[it.name].qty += it.qty; items[it.name].sum += it.price * it.qty; }));
  const top = Object.entries(items).sort((a, b) => b[1].qty - a[1].qty).slice(0, 5); const topEl = document.getElementById('st-top-items');
  topEl.innerHTML = top.length ? top.map(([name, s], i) => `<div class="flex items-center justify-between bg-gray-950 rounded-lg p-3 border border-gray-800"><div class="flex items-center gap-3"><span class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black">${i + 1}</span><span class="text-gray-200 font-bold">${esc(name)}</span></div><div class="text-right"><p class="text-white font-black">×${s.qty}</p><p class="text-xs text-yellow-400">${fmt(s.sum)}</p></div></div>`).join('') : '<p class="text-gray-500">Нет данных</p>';
};
lucide.createIcons();
</script>
</body>
</html>
