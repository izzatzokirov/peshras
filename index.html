<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peshras — Доставка еды в Исфаре</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
  body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  .line-clamp-1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .anim-slide-up { animation: slideUp .3s ease-out; }
  .anim-fade { animation: fadeIn .25s ease-out; }
  .anim-pop { animation: pop .25s ease-out; }
  .skeleton { background: linear-gradient(90deg, #1f2937 0%, #374151 50%, #1f2937 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .cat-active { background: #10b981 !important; color: #000 !important; box-shadow: 0 8px 24px rgba(16,185,129,.35); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" style="padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px))">

<div id="maintenance-banner" class="hidden bg-amber-500 text-black text-center text-xs font-bold py-2 sticky top-0 z-[60]">
  🔧 Идут технические работы. Заказы временно недоступны.
</div>

<header class="bg-gray-900/95 backdrop-blur border-b border-gray-800 sticky top-0 z-30 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <img src="https://i.ibb.co/FbhxLR8c/1786542023977.png" alt="Peshras" class="h-9 w-9 rounded-xl object-cover bg-gray-800" onerror="this.style.display='none'">
        <span class="text-lg font-black tracking-wider text-emerald-400">PESHRAS</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="search-toggle" class="w-9 h-9 rounded-xl bg-gray-950 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-emerald-400 transition">
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
        <div class="flex items-center gap-1.5 text-xs text-gray-400 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-800">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i><span>Исфара</span>
        </div>
      </div>
    </div>
    <div id="search-wrap" class="hidden pt-3 anim-fade">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="search-input" type="text" placeholder="Поиск блюд..." class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-9 pr-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
      </div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-5 space-y-6">
  <!-- Промо-баннеры -->
  <div class="scrollbar-none flex gap-3 pb-1 overflow-x-auto">
    <div class="min-w-[85%] sm:min-w-[48%] lg:min-w-[32%] rounded-3xl p-5 bg-gradient-to-br from-yellow-400 to-amber-600 text-black shadow-xl shrink-0">
      <span class="bg-black/30 text-white text-[9px] font-black px-2 py-0.5 rounded-full">СКОРО</span>
      <h3 class="font-black text-base mt-1">Бонусные баллы</h3>
    </div>
    <div class="min-w-[85%] sm:min-w-[48%] lg:min-w-[32%] rounded-3xl p-5 bg-gradient-to-br from-emerald-500 to-teal-700 text-white shadow-xl shrink-0">
      <span class="bg-white/20 text-white text-[9px] font-black px-2 py-0.5 rounded-full">ХИТ</span>
      <h3 class="font-black text-base mt-1">Доставка от 100 с. бесплатно</h3>
    </div>
    <div class="min-w-[85%] sm:min-w-[48%] lg:min-w-[32%] rounded-3xl p-5 bg-gradient-to-br from-indigo-500 to-violet-700 text-white shadow-xl shrink-0">
      <span class="bg-white/20 text-white text-[9px] font-black px-2 py-0.5 rounded-full">СКОРО</span>
      <h3 class="font-black text-base mt-1">Скидки и акции</h3>
    </div>
  </div>

  <div id="menu-context" class="hidden items-center justify-between bg-gray-900 border border-gray-800 rounded-2xl px-4 py-3">
    <span id="menu-context-title" class="text-sm font-bold text-white">Меню</span>
    <button id="menu-context-reset" class="text-xs text-emerald-400 font-bold flex items-center gap-1"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Все рестораны</button>
  </div>

  <section id="restaurants-section" class="space-y-3">
    <h2 class="text-lg font-bold text-white">Рестораны Исфары</h2>
    <div id="restaurants-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <div class="col-span-full skeleton h-24 rounded-2xl"></div>
    </div>
  </section>

  <section>
    <h2 class="text-sm font-bold text-white mb-2">Категории</h2>
    <div id="categories" class="scrollbar-none flex gap-2 overflow-x-auto pb-1"></div>
  </section>

  <section id="menu-section" class="space-y-3">
    <h2 class="text-lg font-bold text-white" id="menu-section-title">Меню</h2>
    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
      <div class="skeleton aspect-square rounded-2xl"></div><div class="skeleton aspect-square rounded-2xl"></div>
    </div>
  </section>
</main>

<!-- FAB -->
<div id="cart-floating-bar" class="fixed left-4 right-4 max-w-md mx-auto hidden z-40" style="bottom: calc(88px + env(safe-area-inset-bottom, 0px));">
  <button onclick="openCartModal()" class="w-full bg-emerald-500 text-black font-extrabold py-3.5 px-5 rounded-2xl shadow-2xl flex items-center justify-between active:scale-95 transition">
    <div class="flex items-center gap-2"><span id="cart-count-badge" class="bg-black text-emerald-400 text-xs px-2 py-0.5 rounded-full font-black">0</span><span>Корзина</span></div>
    <span id="cart-total-badge" class="text-sm">0 с.</span>
  </button>
</div>

<!-- CART MODAL -->
<div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-gray-900 border border-gray-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 space-y-5 max-h-[92vh] overflow-y-auto anim-slide-up">
    <div id="cart-step-items" class="space-y-5">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <h3 class="font-extrabold text-lg text-white">Ваша корзина</h3>
        <button onclick="closeCartModal()" class="text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div id="cart-items-container" class="space-y-3"></div>
      <div class="space-y-1 text-xs border-t border-gray-800 pt-3">
        <div class="flex justify-between text-gray-400"><span>Товары:</span><span id="cart-subtotal" class="text-white">0 с.</span></div>
        <div class="flex justify-between text-gray-400"><span>Доставка:</span><span id="cart-delivery" class="text-white">0 с.</span></div>
        <div class="flex justify-between font-black text-base pt-1"><span>Итого:</span><span id="cart-modal-total" class="text-yellow-400">0 с.</span></div>
      </div>
      <div id="min-order-hint" class="hidden text-xs text-red-400 bg-red-500/10 rounded-xl p-2 text-center"></div>
      <button id="go-checkout-btn" class="w-full bg-emerald-500 text-black font-extrabold py-4 rounded-xl text-sm disabled:opacity-50">Оформить заказ</button>
      <button id="clear-cart-btn" class="w-full text-gray-400 font-bold py-2 text-xs">Очистить корзину</button>
    </div>
    <div id="cart-step-form" class="hidden space-y-4">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <button id="back-to-items" class="text-gray-400 text-xs">← Назад</button>
        <h3 class="font-extrabold text-base text-white">Доставка</h3>
        <div class="w-8"></div>
      </div>
      <form id="checkout-form" class="space-y-3">
        <input type="text" id="client-name" required placeholder="Имя" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
        <input type="tel" id="client-phone" required placeholder="Телефон" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
        <input type="text" id="client-address" required placeholder="Адрес в Исфаре" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="client-persons" value="1" min="1" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
          <select id="client-payment" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300">
            <option value="cash">Наличные</option><option value="korvarok">Корварок</option><option value="alif">Алиф Мобайл</option>
          </select>
        </div>
        <input type="text" id="client-comment" placeholder="Комментарий" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs">
        <div class="flex justify-between font-black text-base pt-2 border-t border-gray-800"><span>Итого:</span><span id="cart-modal-total-2" class="text-yellow-400">0 с.</span></div>
        <button type="submit" id="submit-order-btn" class="w-full bg-emerald-500 text-black font-extrabold py-4 rounded-xl text-sm">Подтвердить заказ</button>
      </form>
    </div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-gray-900 border border-gray-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-4 max-h-[92vh] overflow-y-auto anim-slide-up">
    <div class="flex items-center justify-between border-b border-gray-800 pb-4">
      <h3 class="font-extrabold text-lg text-white">Профиль</h3>
      <button onclick="closeProfile()" class="text-gray-400"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>
    <div class="grid grid-cols-1 gap-2" id="profile-menu-list">
      <button onclick="showPanel('about')" class="profile-item flex justify-between bg-gray-950 border border-gray-800 rounded-2xl p-4 text-left"><span class="text-sm font-bold text-white">О нас</span></button>
      <button onclick="showPanel('terms')" class="profile-item flex justify-between bg-gray-950 border border-gray-800 rounded-2xl p-4 text-left"><span class="text-sm font-bold text-white">Условия и оплата</span></button>
      <button onclick="showPanel('history')" class="profile-item flex justify-between bg-gray-950 border border-gray-800 rounded-2xl p-4 text-left"><span class="text-sm font-bold text-white">История заказов</span></button>
      <button onclick="showPanel('support')" class="profile-item flex justify-between bg-gray-950 border border-gray-800 rounded-2xl p-4 text-left"><span class="text-sm font-bold text-white">Связаться с нами</span></button>
    </div>
    <div id="profile-panel" class="hidden bg-gray-950 border border-gray-800 rounded-2xl p-4 text-xs">
      <div class="flex justify-between mb-2">
        <h4 id="panel-title" class="font-bold text-white"></h4>
        <button onclick="document.getElementById('profile-panel').classList.add('hidden')" class="text-gray-500">✕</button>
      </div>
      <div id="panel-body" class="text-gray-300 leading-relaxed"></div>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur border-t border-gray-800 z-40 safe-bottom">
  <div class="max-w-7xl mx-auto grid grid-cols-4">
    <button onclick="scrollToTop()" class="flex flex-col items-center py-3 text-emerald-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px]">Главная</span></button>
    <button onclick="scrollToRest()" class="flex flex-col items-center py-3 text-gray-500"><i data-lucide="store" class="w-5 h-5"></i><span class="text-[10px]">Рестораны</span></button>
    <button onclick="openCartModal()" class="flex flex-col items-center py-3 text-gray-500 relative"><i data-lucide="shopping-bag" class="w-5 h-5"></i><span class="text-[10px]">Корзина</span><span id="nav-cart-badge" class="hidden absolute top-2 right-1/3 bg-emerald-500 text-black text-[9px] rounded-full px-1">0</span></button>
    <button onclick="openProfile()" class="flex flex-col items-center py-3 text-gray-500"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px]">Профиль</span></button>
  </div>
</nav>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[9999] hidden bg-emerald-500 text-black font-bold px-5 py-3 rounded-2xl shadow-xl text-sm" style="bottom: 160px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, doc, getDoc, setDoc, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM",
  authDomain: "peshras-delivery.firebaseapp.com",
  projectId: "peshras-delivery",
  storageBucket: "peshras-delivery.firebasestorage.app",
  messagingSenderId: "790787117044",
  appId: "1:790787117044:web:217ef1bea4edbab24873a1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allProducts = [], allRestaurants = [], cart = {}, SETTINGS = {}, BLOCKED = [];
let activeCategory = 'all', activeRestaurantId = null, searchQuery = '';

const CAT_LABEL = { plov: '🍚 Плов', shashlik: '🍢 Шашлык', pizza: '🍕 Пицца', burger: '🍔 Бургеры', fastfood: '🌭 Фастфуд', soup: '🍲 Супы', salad: '🥗 Салаты', bakery: '🥐 Выпечка', dessert: '🍰 Десерты', drinks: '🥤 Напитки', other: '🍽 Другое' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU') + ' сомонӣ';

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed left-1/2 -translate-x-1/2 z-[9999] font-bold px-5 py-3 rounded-2xl shadow-2xl text-sm anim-fade ${type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-black'}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

async function loadSettings() {
  try {
    const s = await getDoc(doc(db, 'settings', 'config'));
    if (s.exists()) SETTINGS = s.data();
    if (SETTINGS.maintenance) document.getElementById('maintenance-banner').classList.remove('hidden');
  } catch (e) {}
}

async function loadBlocked() {
  try {
    const snap = await getDocs(collection(db, 'blocked_phones'));
    BLOCKED = snap.docs.map(d => d.data().phone);
  } catch(e) {}
}

function loadRestaurants() {
  onSnapshot(collection(db, 'restaurants'), snap => {
    allRestaurants = [];
    snap.forEach(d => allRestaurants.push({ id: d.id, ...d.data() }));
    renderRestaurants();
  });
}

function loadProducts() {
  onSnapshot(collection(db, 'products'), snap => {
    allProducts = [];
    snap.forEach(d => {
      const p = { id: d.id, ...d.data() };
      if (p.is_hidden === true) return;
      allProducts.push(p);
    });
    renderCategories(); renderProducts();
  });
}

function renderRestaurants() {
  const list = document.getElementById('restaurants-list');
  let filtered = allRestaurants.filter(r => r.is_banned !== true);
  if (searchQuery) filtered = filtered.filter(r => (r.name || '').toLowerCase().includes(searchQuery.toLowerCase()));
  
  if (!filtered.length) {
    list.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500 text-xs">Ресторанов пока нет</div>`;
    return;
  }
  list.innerHTML = filtered.map(r => {
    const isClosed = r.shift_open === false;
    return `
      <div onclick="openRestaurant('${r.id}')" class="bg-gray-900 border border-gray-800 rounded-2xl p-3 flex gap-3 cursor-pointer ${isClosed ? 'opacity-60' : ''}">
        <div class="w-20 h-20 bg-gray-800 rounded-xl overflow-hidden shrink-0">
          ${r.logo_url ? `<img src="${esc(r.logo_url)}" class="w-full h-full object-cover">` : ''}
        </div>
        <div class="flex-1 min-w-0 flex flex-col justify-center">
          <h3 class="font-bold text-sm text-white truncate">${esc(r.name)}</h3>
          <p class="text-[10px] text-gray-500 truncate">${esc(r.address || '')}</p>
          ${isClosed ? `<span class="text-[10px] text-red-400 mt-1">🔴 Закрыт</span>` : `<span class="text-[10px] text-emerald-400 mt-1">~35 мин</span>`}
        </div>
      </div>`;
  }).join('');
}

window.openRestaurant = (id) => {
  activeRestaurantId = id;
  activeCategory = 'all';
  document.getElementById('menu-context-title').textContent = 'Меню: ' + allRestaurants.find(r => r.id === id)?.name;
  document.getElementById('menu-context').classList.remove('hidden');
  document.getElementById('menu-context').classList.add('flex');
  renderCategories(); renderProducts();
  document.getElementById('menu-section').scrollIntoView({ behavior: 'smooth' });
};

document.getElementById('menu-context-reset').onclick = () => {
  activeRestaurantId = null;
  document.getElementById('menu-context').classList.add('hidden');
  renderCategories(); renderProducts();
};

function renderCategories() {
  const el = document.getElementById('categories');
  const prods = allProducts.filter(p => !activeRestaurantId || p.restaurant_id === activeRestaurantId);
  const counts = {}; prods.forEach(p => { if (p.category) counts[p.category] = 1; });
  let html = `<button onclick="setCat('all')" class="cat-btn ${activeCategory==='all'?'cat-active':'bg-gray-900 text-gray-300'} px-4 py-2 rounded-xl text-xs shrink-0">Все</button>`;
  Object.keys(CAT_LABEL).forEach(k => {
    if(counts[k]) html += `<button onclick="setCat('${k}')" class="cat-btn ${activeCategory===k?'cat-active':'bg-gray-900 text-gray-300'} px-4 py-2 rounded-xl text-xs shrink-0">${CAT_LABEL[k]}</button>`;
  });
  el.innerHTML = html;
}
window.setCat = c => { activeCategory = c; renderCategories(); renderProducts(); };

function renderProducts() {
  const grid = document.getElementById('products-grid');
  let list = allProducts;
  if (activeRestaurantId) list = list.filter(p => p.restaurant_id === activeRestaurantId);
  if (activeCategory !== 'all') list = list.filter(p => p.category === activeCategory);
  if (searchQuery) list = list.filter(p => (p.name||'').toLowerCase().includes(searchQuery.toLowerCase()));

  if (!list.length) { grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500 text-xs">Нет блюд</div>`; return; }

  grid.innerHTML = list.map(p => {
    const r = allRestaurants.find(x => x.id === p.restaurant_id);
    const inStock = p.in_stock !== false;
    const closed = r?.shift_open === false;
    return `
      <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between">
        <div>
          <img src="${esc(p.image_url || '')}" class="w-full aspect-square object-cover bg-gray-800" onerror="this.src='https://via.placeholder.com/300'">
          <div class="p-2">
            <h3 class="font-bold text-xs text-white truncate">${esc(p.name)}</h3>
            <p class="text-[10px] text-gray-400 line-clamp-1">${esc(p.description)}</p>
          </div>
        </div>
        <div class="p-2 pt-0 flex justify-between items-center">
          <span class="font-black text-xs text-yellow-400">${p.price} с.</span>
          ${!inStock ? `<span class="text-[10px] text-red-400">Стоп</span>` : 
            closed ? `<span class="text-[10px] text-gray-500">Закрыт</span>` : 
            `<button onclick="addToCart('${p.id}')" class="bg-emerald-500 text-black p-1.5 rounded-lg"><i data-lucide="plus" class="w-4 h-4"></i></button>`}
        </div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

document.getElementById('search-toggle').onclick = () => document.getElementById('search-wrap').classList.toggle('hidden');
document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; renderProducts(); renderRestaurants(); };

window.addToCart = (id) => {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  const rest = allRestaurants.find(r => r.id === p.restaurant_id);
  if (rest?.shift_open === false) return showToast('Ресторан закрыт', 'error');
  if (SETTINGS.maintenance) return showToast('Техработы', 'error');

  if (Object.keys(cart).length) {
    const existingRid = Object.values(cart)[0].product.restaurant_id;
    if (existingRid !== p.restaurant_id) {
      if (!confirm('В корзине блюда из другого ресторана. Заменить?')) return;
      cart = {};
    }
  }
  if (cart[id]) cart[id].qty++; else cart[id] = { product: p, qty: 1 };
  updateCartUI();
};
window.changeQty = (id, delta) => {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  updateCartUI(); renderCartItems();
};

function calc() {
  let sub = 0, count = 0;
  Object.values(cart).forEach(i => { sub += i.product.price * i.qty; count += i.qty; });
  const del = sub >= (SETTINGS.free_from || 100) || sub === 0 ? 0 : (SETTINGS.delivery_price || 10);
  return { sub, del, total: sub + del, count };
}

function updateCartUI() {
  const { sub, del, total, count } = calc();
  document.getElementById('cart-floating-bar').classList.toggle('hidden', count === 0);
  document.getElementById('nav-cart-badge').classList.toggle('hidden', count === 0);
  if (count > 0) {
    document.getElementById('cart-count-badge').textContent = count;
    document.getElementById('cart-total-badge').textContent = fmt(total);
    document.getElementById('nav-cart-badge').textContent = count;
  }
  document.getElementById('cart-subtotal').textContent = fmt(sub);
  document.getElementById('cart-delivery').textContent = del === 0 ? 'Бесплатно' : fmt(del);
  document.getElementById('cart-modal-total').textContent = fmt(total);
  document.getElementById('cart-modal-total-2').textContent = fmt(total);
  
  const min = SETTINGS.min_order || 30;
  const minHint = document.getElementById('min-order-hint');
  const goBtn = document.getElementById('go-checkout-btn');
  if (sub > 0 && sub < min) {
    minHint.classList.remove('hidden'); minHint.textContent = `Минимум ${min} с. Добавьте ${min - sub} с.`;
    goBtn.disabled = true;
  } else { minHint.classList.add('hidden'); goBtn.disabled = count === 0; }
}

function renderCartItems() {
  const el = document.getElementById('cart-items-container');
  const items = Object.entries(cart);
  if (!items.length) { el.innerHTML = `<div class="text-center text-gray-500 text-xs py-4">Пусто</div>`; return; }
  el.innerHTML = items.map(([id, i]) => `
    <div class="flex items-center justify-between bg-gray-950 p-2 rounded-xl">
      <div class="text-xs text-white">${esc(i.product.name)} <span class="text-yellow-400 font-bold ml-1">${fmt(i.product.price * i.qty)}</span></div>
      <div class="flex items-center gap-2">
        <button onclick="changeQty('${id}', -1)" class="text-gray-400">−</button>
        <span class="text-xs text-white font-bold">${i.qty}</span>
        <button onclick="changeQty('${id}', 1)" class="text-gray-400">+</button>
      </div>
    </div>
  `).join('');
}

window.openCartModal = () => {
  const saved = JSON.parse(localStorage.getItem('peshras_user') || '{}');
  if (saved.name) document.getElementById('client-name').value = saved.name;
  if (saved.phone) document.getElementById('client-phone').value = saved.phone;
  if (saved.address) document.getElementById('client-address').value = saved.address;
  renderCartItems(); updateCartUI();
  document.getElementById('cart-step-items').classList.remove('hidden');
  document.getElementById('cart-step-form').classList.add('hidden');
  document.getElementById('cart-modal').classList.remove('hidden');
  document.getElementById('cart-modal').classList.add('flex');
  document.body.style.overflow = 'hidden';
};
window.closeCartModal = () => {
  document.getElementById('cart-modal').classList.add('hidden');
  document.getElementById('cart-modal').classList.remove('flex');
  document.body.style.overflow = '';
};

document.getElementById('go-checkout-btn').onclick = () => {
  document.getElementById('cart-step-items').classList.add('hidden');
  document.getElementById('cart-step-form').classList.remove('hidden');
};
document.getElementById('back-to-items').onclick = () => {
  document.getElementById('cart-step-form').classList.add('hidden');
  document.getElementById('cart-step-items').classList.remove('hidden');
};
document.getElementById('clear-cart-btn').onclick = () => { if(confirm('Очистить?')) { cart={}; updateCartUI(); renderCartItems(); } };

document.getElementById('checkout-form').onsubmit = async (e) => {
  e.preventDefault();
  if (SETTINGS.maintenance) return showToast('Техработы', 'error');
  const phone = document.getElementById('client-phone').value;
  if (BLOCKED.includes(phone)) return showToast('Номер заблокирован', 'error');
  
  const btn = document.getElementById('submit-order-btn');
  btn.disabled = true; btn.textContent = 'Отправка...';

  const items = Object.values(cart).map(i => ({ id: i.product.id, name: i.product.name, price: i.product.price, qty: i.qty }));
  const rid = Object.values(cart)[0].product.restaurant_id;
  const rest = allRestaurants.find(r => r.id === rid);

  const { sub, del, total } = calc();
  const commPct = rest?.commission || 0;
  const commAmt = total * (commPct / 100);

  let orderNum;
  try {
    const cntRef = doc(db, 'settings', 'counters');
    const cnt = await getDoc(cntRef);
    orderNum = (cnt.exists() ? (cnt.data().orders || 0) : 0) + 1;
    await setDoc(cntRef, { orders: orderNum }, { merge: true });
  } catch { orderNum = Date.now(); }

  try {
    await addDoc(collection(db, 'orders'), {
      order_number: orderNum,
      client_name: document.getElementById('client-name').value,
      client_phone: phone,
      delivery_address: document.getElementById('client-address').value,
      comment: document.getElementById('client-comment').value,
      persons: Number(document.getElementById('client-persons').value),
      payment_method: document.getElementById('client-payment').value,
      items: items,
      subtotal: sub, delivery_price: del, total_price: total,
      commission_percent: commPct, commission_amount: commAmt,
      restaurant_id: rid,
      status: 'new',
      created_at: serverTimestamp()
    });
    localStorage.setItem('peshras_user', JSON.stringify({ name: document.getElementById('client-name').value, phone, address: document.getElementById('client-address').value }));
    cart = {}; updateCartUI(); closeCartModal(); e.target.reset();
    showToast(`🎉 Заказ #${orderNum} отправлен!`);
  } catch(err) { showToast('Ошибка', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Подтвердить заказ'; }
};

window.openProfile = () => {
  document.getElementById('profile-modal').classList.remove('hidden');
  document.getElementById('profile-modal').classList.add('flex');
  document.body.style.overflow = 'hidden';
};
window.closeProfile = () => {
  document.getElementById('profile-modal').classList.add('hidden');
  document.getElementById('profile-modal').classList.remove('flex');
  document.body.style.overflow = '';
};

window.showPanel = async (key) => {
  const p = document.getElementById('profile-panel');
  p.classList.remove('hidden');
  const title = document.getElementById('panel-title');
  const body = document.getElementById('panel-body');
  
  if (key === 'about') {
    title.textContent = 'О нас'; body.innerHTML = `<p class="whitespace-pre-line">${esc(SETTINGS.about_text || 'Информация скоро появится')}</p>`;
  }
  if (key === 'terms') {
    title.textContent = 'Условия'; body.innerHTML = `<p class="whitespace-pre-line">${esc(SETTINGS.terms_text || 'Информация скоро появится')}</p>`;
  }
  if (key === 'support') {
    title.textContent = 'Поддержка';
    body.innerHTML = `<p>Телефон: ${esc(SETTINGS.phone || '—')}</p><p>Telegram: ${esc(SETTINGS.telegram || '—')}</p>`;
  }
  if (key === 'history') {
    title.textContent = 'История заказов';
    body.innerHTML = `<input id="hist-phone" placeholder="+992..." class="w-full bg-gray-900 border border-gray-800 rounded p-2 mb-2" value="${JSON.parse(localStorage.getItem('peshras_user')||'{}').phone || ''}"><button onclick="findOrders()" class="bg-emerald-500 text-black px-3 py-1 rounded">Найти</button><div id="hist-res" class="mt-2 space-y-2"></div>`;
  }
};

window.findOrders = async () => {
  const phone = document.getElementById('hist-phone').value;
  const res = document.getElementById('hist-res');
  res.innerHTML = 'Поиск...';
  try {
    const q = query(collection(db, 'orders'), where('client_phone', '==', phone), orderBy('created_at', 'desc'), limit(10));
    const snap = await getDocs(q);
    if (snap.empty) return res.innerHTML = 'Нет заказов';
    res.innerHTML = snap.docs.map(d => {
      const o = d.data();
      return `<div class="bg-gray-900 p-2 rounded border border-gray-800 text-[10px]">
        <b>#${o.order_number}</b> — ${o.total_price} с.<br><span class="text-emerald-400">${o.status}</span>
      </div>`;
    }).join('');
  } catch(e) { res.innerHTML = 'Ошибка поиска'; }
};

window.scrollToTop = () => window.scrollTo({top:0, behavior:'smooth'});
window.scrollToRest = () => document.getElementById('restaurants-section').scrollIntoView({behavior:'smooth'});

(async () => {
  await loadSettings(); await loadBlocked();
  loadRestaurants(); loadProducts(); updateCartUI();
  lucide.createIcons();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
