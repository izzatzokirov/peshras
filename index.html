<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peshras — Доставка еды в Исфаре</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 pb-24 min-h-screen">

    <!-- ВЕРХНЯЯ ШАПКА (HEADER) -->
    <header class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl font-black text-emerald-400 tracking-wider">PESHRAS <span class="text-yellow-400 text-xs px-2 py-0.5 bg-yellow-400/10 rounded-full border border-yellow-400/20">EATS</span></span>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-400 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-800">
                <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i>
                <span>Исфара</span>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

        <!-- Баннер -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-800 rounded-3xl p-6 sm:p-8 text-white space-y-2 relative overflow-hidden shadow-2xl">
            <span class="bg-black/30 backdrop-blur text-emerald-200 text-xs font-bold px-3 py-1 rounded-full border border-white/10 inline-block">Быстрая доставка</span>
            <h1 class="text-2xl sm:text-4xl font-extrabold">Любимая еда из ресторанов Исфары</h1>
            <p class="text-emerald-100 text-xs sm:text-sm">Заказывайте плов, шашлыки, фастфуд и напитки прямо к двери!</p>
        </div>

        <!-- КАТЕГОРИИ МЕНЮ -->
        <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none text-xs font-bold">
            <button onclick="filterCategory('all')" class="cat-btn bg-emerald-500 text-black px-4 py-2.5 rounded-xl whitespace-nowrap transition shadow-lg shadow-emerald-500/20">Все блюда</button>
            <button onclick="filterCategory('hits')" class="cat-btn bg-gray-900 border border-gray-800 text-gray-300 hover:border-emerald-500 px-4 py-2.5 rounded-xl whitespace-nowrap transition">🔥 Хит сезона</button>
            <button onclick="filterCategory('popular')" class="cat-btn bg-gray-900 border border-gray-800 text-gray-300 hover:border-emerald-500 px-4 py-2.5 rounded-xl whitespace-nowrap transition">⭐ Популярное</button>
            <button onclick="filterCategory('new')" class="cat-btn bg-gray-900 border border-gray-800 text-gray-300 hover:border-emerald-500 px-4 py-2.5 rounded-xl whitespace-nowrap transition">✨ Новинки</button>
        </div>

        <!-- КАТАЛОГ ТОВАРОВ -->
        <section class="space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="utensils" class="w-5 h-5 text-emerald-400"></i>
                <span>Меню ресторанов</span>
            </h2>
            <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="col-span-full py-12 text-center text-gray-500 text-xs">Загрузка вкусных блюд...</div>
            </div>
        </section>

    </main>

    <!-- ПЛАВАЮЩАЯ КНОПКА КОРЗИНЫ ВНИЗУ ЭКРАНА -->
    <div id="cart-floating-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto hidden z-40">
        <button onclick="openCartModal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3.5 px-5 rounded-2xl shadow-2xl flex items-center justify-between transition transform active:scale-95">
            <div class="flex items-center gap-2">
                <span id="cart-count-badge" class="bg-black text-emerald-400 text-xs px-2 py-0.5 rounded-full font-black">0</span>
                <span>Корзина</span>
            </div>
            <span id="cart-total-badge" class="text-sm">0 сомонӣ</span>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КОРЗИНЫ И ОФОРМЛЕНИЯ ЗАКАЗА -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-gray-900 border border-gray-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 space-y-6 max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                <h3 class="font-extrabold text-lg text-white flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i>
                    <span>Ваш заказ</span>
                </h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-white p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Список товаров в корзине -->
            <div id="cart-items-container" class="space-y-3">
                <div class="text-gray-500 text-xs text-center py-4">Корзина пуста</div>
            </div>

            <!-- Форма данных клиента -->
            <form id="checkout-form" class="space-y-4 pt-4 border-t border-gray-800">
                <div class="space-y-1">
                    <label class="text-[11px] text-gray-400 font-semibold">Ваше имя</label>
                    <input type="text" id="client-name" required placeholder="Например: Изат" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] text-gray-400 font-semibold">Номер телефона</label>
                    <input type="tel" id="client-phone" required placeholder="+992 92 XXX XX XX" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] text-gray-400 font-semibold">Адрес доставки в Исфаре</label>
                    <input type="text" id="client-address" required placeholder="Улица, дом, ориентир" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="pt-2 flex justify-between items-center font-black text-sm text-white">
                    <span>Итого к оплате:</span>
                    <span id="cart-modal-total" class="text-yellow-400 text-base">0 сомонӣ</span>
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-xs shadow-lg shadow-emerald-500/20">
                    <span>Подтвердить и отправить заказ</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- FIREBASE И ЛОГИКА КОРЗИНЫ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBGUkISLQ1Qm9xfYkVgZhoLeR_P_VTSrhM",
          authDomain: "peshras-delivery.firebaseapp.com",
          projectId: "peshras-delivery",
          storageBucket: "peshras-delivery.firebasestorage.app",
          messagingSenderId: "790787117044",
          appId: "1:790787117044:web:217ef1bea4edbab24873a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = {}; // { prodId: { product, qty } }

        // Загрузка блюд из базы Firestore
        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            try {
                const snap = await getDocs(collection(db, "products"));
                if (snap.empty) {
                    grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500 text-xs">Пока нет доступных блюд. Рестораны скоро добавят меню!</div>`;
                    return;
                }
                allProducts = [];
                snap.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts(allProducts);
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-red-400 text-xs">Ошибка загрузки блюд</div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                const inStock = p.in_stock !== false;
                grid.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-gray-700 transition">
                        <div>
                            <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="w-full h-32 sm:h-40 object-cover bg-gray-800">
                            <div class="p-3 space-y-1">
                                <h3 class="font-bold text-xs sm:text-sm text-white line-clamp-1">${p.name}</h3>
                                <p class="text-[10px] text-gray-400 line-clamp-2">${p.description || 'Вкуснейшее блюдо'}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0 flex items-center justify-between">
                            <span class="font-black text-xs sm:text-sm text-yellow-400">${p.price} с.</span>
                            ${inStock ? `
                                <button onclick="addToCart('${p.id}')" class="bg-emerald-500 hover:bg-emerald-400 text-black p-2 rounded-xl transition font-extrabold flex items-center justify-center">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            ` : `
                                <span class="text-[10px] text-red-400 bg-red-500/10 px-2 py-1 rounded">Стоп-лист</span>
                            `}
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // Фильтрация по категориям
        window.filterCategory = function(cat) {
            if (cat === 'all') {
                renderProducts(allProducts);
            } else {
                renderProducts(allProducts.filter(p => p.category === cat));
            }
        };

        // Логика корзины
        window.addToCart = function(prodId) {
            const product = allProducts.find(p => p.id === prodId);
            if (!product) return;

            if (cart[prodId]) {
                cart[prodId].qty++;
            } else {
                cart[prodId] = { product, qty: 1 };
            }
            updateCartUI();
        };

        window.changeQty = function(prodId, delta) {
            if (!cart[prodId]) return;
            cart[prodId].qty += delta;
            if (cart[prodId].qty <= 0) {
                delete cart[prodId];
            }
            updateCartUI();
            renderCartItems();
        };

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalCount += item.qty;
                totalPrice += item.product.price * item.qty;
            });

            const bar = document.getElementById('cart-floating-bar');
            if (totalCount > 0) {
                bar.classList.remove('hidden');
                document.getElementById('cart-count-badge').innerText = totalCount;
                document.getElementById('cart-total-badge').innerText = totalPrice + ' сомонӣ';
            } else {
                bar.classList.add('hidden');
            }
            document.getElementById('cart-modal-total').innerText = totalPrice + ' сомонӣ';
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const items = Object.entries(cart);

            if (items.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-xs text-center py-4">Корзина пуста</div>`;
                closeCartModal();
                return;
            }

            container.innerHTML = '';
            items.forEach(([id, item]) => {
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-950 p-3 rounded-xl border border-gray-800">
                        <div class="space-y-0.5">
                            <h4 class="font-bold text-xs text-white">${item.product.name}</h4>
                            <div class="text-[11px] text-yellow-400 font-bold">${item.product.price * item.qty} сомонӣ</div>
                        </div>
                        <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-lg p-1">
                            <button onclick="changeQty('${id}', -1)" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-white font-bold">-</button>
                            <span class="text-xs font-bold text-white px-1">${item.qty}</span>
                            <button onclick="changeQty('${id}', 1)" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-white font-bold">+</button>
                        </div>
                    </div>
                `;
            });
        }

        window.openCartModal = function() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        };

        window.closeCartModal = function() {
            document.getElementById('cart-modal').classList.add('hidden');
        };

        // Отправка заказа в Firestore
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const itemsArray = Object.values(cart).map(i => ({
                id: i.product.id,
                name: i.product.name,
                price: i.product.price,
                qty: i.qty
            }));

            if (itemsArray.length === 0) return;

            // Определяем ID ресторана (берем из первого товара)
            const restaurantId = Object.values(cart)[0].product.restaurant_id || 'unknown';

            let totalPrice = 0;
            itemsArray.forEach(i => totalPrice += i.price * i.qty);

            const orderData = {
                client_name: document.getElementById('client-name').value,
                client_phone: document.getElementById('client-phone').value,
                delivery_address: document.getElementById('client-address').value,
                items: itemsArray,
                total_price: totalPrice,
                restaurant_id: restaurantId,
                status: 'new',
                created_at: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "orders"), orderData);
                alert("🎉 Ваш заказ успешно отправлен! Ресторан уже начал его готовить.");
                cart = {};
                updateCartUI();
                closeCartModal();
                document.getElementById('checkout-form').reset();
            } catch (err) {
                console.error(err);
                alert("Ошибка при отправке заказа. Попробуйте еще раз.");
            }
        });

        loadProducts();
        lucide.createIcons();
    </script>
</body>
</html>
